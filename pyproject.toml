[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m100-report-bot"
version = "0.1.0"
description = "Telegram daily construction reports with confirmed Google Sheets and Bitrix24 writes"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiohttp>=3.13,<4",
  "aiogram==3.31.0",
  "google-auth[requests]>=2.40,<3",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[project.scripts]
m100-bot = "m100_bot.__main__:main"
m100-check = "m100_bot.check:main"

[tool.hatch.build.targets.wheel]
packages = ["src/m100_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
