services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: m100
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m100_local}
      POSTGRES_DB: m100
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m100 -d m100"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://m100:${POSTGRES_PASSWORD:-m100_local}@postgres:5432/m100
      WEB_HOST: 0.0.0.0
      WEB_AUTO_OPEN: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
volumes:
  postgres-data:
